<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouveautés - Evolutions</title>
    <meta name="description" content="Toutes les nouveautés du serveur Evolutions : classes, donjons, raids et mises à jour.">
    <link rel="icon" href="/img/logo.png">
    <link rel="stylesheet" href="/css/site.css">
</head>

<body data-page="nouveautes">
    <!-- header -->

    <main data-news-page>
        <section class="banner" data-news-banner>
            <div class="wrap">
                <div class="eyebrow">Le journal du serveur</div>
                <h1>Nouveautés</h1>
                <p>Classes, donjons, raids et améliorations : tout ce qui change sur Evolutions.</p>
            </div>
        </section>

        <section class="section" style="padding-top: 40px" data-news-list>
            <div class="wrap">
                <div class="filters" data-news-filters></div>
                <div data-news-featured></div>
                <div class="news-grid" data-news-all></div>
            </div>
        </section>

        <section class="section" style="padding-top: calc(var(--header) + 50px); display: none" data-news-article>
            <div class="wrap">
                <article class="article">
                    <a class="back" href="/nouveautes">← Toutes les nouveautés</a>
                    <div class="article-pic"><img alt="" data-article-pic></div>
                    <div class="article-meta"><span class="tag" data-article-tag></span><span data-article-date></span></div>
                    <h1 data-article-title></h1>
                    <div class="article-body" data-article-body></div>
                </article>
            </div>
        </section>
    </main>

    <!-- footer -->
</body>

</html>
