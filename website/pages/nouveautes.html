<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouveautés - Evolutions</title>
    <meta name="description" content="Les nouveautés et notes de mise à jour du serveur Evolutions.">
    <link rel="icon" href="/img/logo.png">
    <link rel="stylesheet" href="/css/site.css">
</head>

<body data-page="nouveautes">
    <!-- header -->

    <main data-news-page>
        <section class="page-head" data-news-head>
            <div class="wrap">
                <h1>Nouveautés</h1>
                <p>Mises à jour et annonces du serveur.</p>
            </div>
        </section>

        <div class="wrap page narrow" data-news-list>
            <div class="filters" data-news-filters></div>
            <div data-news-all></div>
        </div>

        <div class="wrap page narrow" data-news-article hidden>
            <a class="back" href="/nouveautes">‹ Toutes les nouveautés</a>
            <div class="panel">
                <div class="panel-inner article">
                    <div class="article-pic"><img alt="" data-article-pic></div>
                    <div class="news-meta"><span class="tag" data-article-tag></span><span data-article-date></span></div>
                    <h1 data-article-title></h1>
                    <div class="article-body" data-article-body></div>
                </div>
            </div>
        </div>
    </main>

    <!-- footer -->
</body>

</html>
